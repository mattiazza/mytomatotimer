[project]
name = "mytomatotimer"
version = "0.1.0"
description = "macOS menu-bar study timer (focus blocks and breaks) with local stats."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyobjc-framework-servicemanagement>=13.0",
    "pywebview>=6.2.1",
    "rumps>=0.4.0",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "py2app>=0.28.10",
    "pytest>=9.2.0",
]
